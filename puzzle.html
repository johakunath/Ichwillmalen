<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F6F3E9" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="studio.css" />
    <link rel="stylesheet" href="play.css" />
    <title>Bilderpuzzle · Ich will malen</title>
  </head>
  <body>
    <main class="puzzle-play">
      <div
        class="puzzle-board"
        id="puzzle-board"
        aria-label="Lege die Teile hier hin"
      ></div>
      <div class="puzzle-tray" id="puzzle-tray" aria-label="Puzzleteile"></div>
    </main>
    <div class="puzzle-footer" id="puzzle-footer">
      <div
        class="puzzle-progress"
        id="puzzle-progress"
        aria-label="Passende Teile"
      ></div>
    </div>
    <script src="theme.js?v=studio-v1"></script>
    <script src="js/icons.js"></script>
    <script src="js/art.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/tablet.js"></script>
    <script src="js/studio.js"></script>
    <script src="js/drag.js"></script>
    <script src="js/puzzle.js"></script>
  </body>
</html>
