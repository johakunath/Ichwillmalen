<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F6F3E9" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="studio.css" />
    <link rel="stylesheet" href="drawing.css" />
    <title>Malatelier · Ich will malen</title>
  </head>
  <body>
    <main id="drawing-stage" aria-label="Dein Malpapier">
      <canvas id="paper" aria-label="Malfläche für Finger und Stift"></canvas>
      <div id="drawing-hint" class="stage-hint"></div>
    </main>
    <nav class="drawing-tools" aria-label="Malwerkzeuge">
      <div id="draw-brushes" role="group" aria-label="Stifte"></div>
      <div id="draw-colors" role="group" aria-label="Farben"></div>
      <div id="draw-sizes" role="group" aria-label="Strichbreite"></div>
      <div id="draw-magic" role="group" aria-label="Malzauber"></div>
    </nav>
    <script src="theme.js?v=studio-v1"></script>
    <script src="js/icons.js"></script>
    <script src="js/art.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/tablet.js"></script>
    <script src="js/studio.js"></script>
    <script src="js/brushes.js"></script>
    <script src="js/drawing.js"></script>
  </body>
</html>
