<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F6F3E9" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="studio.css" />
    <link rel="stylesheet" href="painting.css" />
    <link rel="stylesheet" href="discovery.css" />
    <title>Suchspaß · Ich will malen</title>
  </head>
  <body>
    <div id="find-target" role="status"></div>
    <main id="find-stage"><div id="find-world"></div></main>
    <div id="find-finished" role="status" hidden>
      Alle vier Freunde gefunden!
    </div>
    <nav class="tool-dock find-dock" aria-label="Suchspiel">
      <button
        class="studio-button"
        id="find-again"
        aria-label="Eine neue Suchrunde"
      >
        ↻
      </button>
      <div class="dock-divider"></div>
      <div id="find-progress" aria-label="Gefundene Freunde"></div>
      <div class="dock-divider"></div>
      <button
        class="studio-button"
        id="find-next"
        aria-label="In der nächsten Welt suchen"
      >
        →
      </button>
    </nav>
    <script src="theme.js?v=studio-v1"></script>
    <script src="js/icons.js"></script>
    <script src="js/art.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/tablet.js"></script>
    <script src="js/studio.js"></script>
    <script src="js/find.js"></script>
  </body>
</html>
